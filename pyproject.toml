[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "happy-one"
version = "0.1.0"
description = "个人自用统一枢纽：身份、授权、产物分发、许可证、通道信令"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "cryptography>=42.0",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
]

[project.scripts]
happyone = "happyone.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
happyone = ["migrations/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
# 各线测试目录可重名（test_keys.py 等），用 importlib 模式避免模块名冲突
